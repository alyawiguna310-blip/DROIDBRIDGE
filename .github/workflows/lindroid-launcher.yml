name: LINDROID launcher checks

on:
  pull_request:
    paths:
      - "apps/lindroid-launcher/**"
      - ".github/workflows/lindroid-launcher.yml"
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-launcher:
    name: Build and test GTK launcher
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GTK4 development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgtk-4-dev pkg-config

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --manifest-path apps/lindroid-launcher/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path apps/lindroid-launcher/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path apps/lindroid-launcher/Cargo.toml

      - name: Build release binary
        run: cargo build --release --manifest-path apps/lindroid-launcher/Cargo.toml
